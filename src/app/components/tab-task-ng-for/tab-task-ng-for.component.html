<h1 class="text-center">
    Tab Task Using ngFor
</h1>
<ng-container *ngIf="tabsArr.length > 0; else noSkills">
    <div class="card">
    <div class="card-body">
        <ul class="nav nav-pills">
            <li class="nav-item" *ngFor="let skill of tabsArr">
                <a 
                (click)="onChangeSkill(skill.title)"
                [ngClass]="{
                    active : isselected.toLowerCase().includes(skill.title.toLowerCase()) 
                }"
                href="#" class="nav-link">
                    {{skill.title}}
                </a>
            </li>            
        </ul>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <ng-container *ngFor="let skill of tabsArr">
        <div class="card-body" *ngIf="isselected.toLowerCase().includes(skill.title.toLowerCase())" [innerHTML]="skill.content">
       
    </div>
    </ng-container>
    </div>
</div>
</ng-container>

<ng-template #noSkills>
    <p>
    No skill Added Yet...
</p>
</ng-template>
